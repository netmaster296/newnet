[package]
name = "newnet"
version = "0.1.0"
edition = "2021"

[dependencies]
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
ed25519-dalek = "2.1.1"
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
sha2 = "0.10.8"
hmac = "0.12.1"
rand = "0.8.5"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.0", features = ["alloc"] }
flate2 = "1"
snow = { version = "0.10", default-features = false, features = ["std", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom", "risky-raw-split"] }
